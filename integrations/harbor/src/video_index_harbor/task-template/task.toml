version = "1.0"

[task]
name = "video-index/{task_name}"

[metadata]
author_name = "Video-Index authors"
difficulty = "hard"
category = "video-understanding"
tags = {tags}
source_benchmark = "{benchmark}"
item_id = "{item_id}"
capability_group = "{capability_group}"
fine_category = "{fine_category}"
duration_s = {duration_s}
chance = {chance}
protocol = "{protocol}"

[agent]
timeout_sec = 1800.0
network_mode = "no-network"

[verifier]
timeout_sec = 60.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
